name: 构建测试集群双架构镜像

on:
  push:
    branches:
      - codex/build-kubernetes-docker-upgrade
    paths:
      - .github/workflows/build-kubernetes-docker-upgrade.yml
      - .github/scripts/build-kubernetes-docker-upgrade.sh
      - .github/scripts/build-sealos-addons.sh
      - .github/actions/install-sealos/action.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubernetes:
    name: Kubernetes ${{ matrix.item.version }} ${{ matrix.item.runtime }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        item:
          - { version: v1.34.13, runtime: docker }
          - { version: v1.35.10, runtime: docker }
          - { version: v1.36.6, runtime: docker }
          - { version: v1.37.2, runtime: docker }
          - { version: v1.36.6, runtime: containerd }
          - { version: v1.37.2, runtime: containerd }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      KUBERNETES_VERSION: ${{ matrix.item.version }}
      TARGET_RUNTIME: ${{ matrix.item.runtime }}
      TARGET_ARCH: ${{ matrix.platform.arch }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-sealos
        with:
          arch: ${{ matrix.platform.arch }}

      - name: 打包集群镜像并核对内容
        run: |
          image="registry.cn-beijing.aliyuncs.com/vlabs/kubernetes-$TARGET_RUNTIME:$KUBERNETES_VERSION-$TARGET_ARCH"
          bash .github/scripts/build-kubernetes-docker-upgrade.sh \
            "$KUBERNETES_VERSION" "$image" "$RUNNER_TEMP/sealos-images" "$TARGET_ARCH" "$TARGET_RUNTIME"

      - name: 保存可导入 Sealos 的 OCI 归档
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kubernetes-${{ matrix.item.runtime }}-${{ matrix.item.version }}-linux-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/sealos-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  addons:
    name: 配套组件 ${{ matrix.group }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [stable, preview]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      TARGET_ARCH: ${{ matrix.platform.arch }}
      ADDON_GROUP: ${{ matrix.group }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-sealos
        with:
          arch: ${{ matrix.platform.arch }}

      - name: 打包配套组件并核对架构
        run: |
          if ! /usr/bin/python3 -c 'import yaml' >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3-yaml
          fi
          bash .github/scripts/build-sealos-addons.sh \
            "$TARGET_ARCH" "$ADDON_GROUP" "$RUNNER_TEMP/sealos-images"

      - name: 保存配套组件的 OCI 归档
        uses: actions/upload-artifact@v7.0.2
        with:
          name: addons-${{ matrix.group }}-linux-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/sealos-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
