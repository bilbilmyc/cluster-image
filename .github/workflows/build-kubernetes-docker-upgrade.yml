name: 构建测试集群升级镜像

on:
  push:
    branches:
      - codex/build-kubernetes-docker-upgrade
    paths:
      - .github/workflows/build-kubernetes-docker-upgrade.yml
      - .github/scripts/build-kubernetes-docker-upgrade.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 Kubernetes ${{ matrix.version }} Docker 版
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: [v1.34.13, v1.35.10]
    env:
      KUBERNETES_VERSION: ${{ matrix.version }}
      IMAGE: registry.cn-beijing.aliyuncs.com/vlabs/kubernetes-docker:${{ matrix.version }}
      SEALOS_RELEASE: v5.2.0

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 准备构建工具
        run: |
          if ! command -v buildah >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y buildah
          fi

          archive="sealos_${SEALOS_RELEASE#v}_linux_amd64.tar.gz"
          curl -fsSL --retry 4 --max-time 300 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/labring/sealos/releases/download/$SEALOS_RELEASE/$archive"
          printf '%s  %s\n' \
            'feb275bc174ec6d7980f1b40e8ec9aec156fbbff1b1072a94c55f5784c85c221' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sealos"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/sealos"
          binary="$(find "$RUNNER_TEMP/sealos" -type f -name sealos -print -quit)"
          sudo install -m 0755 "$binary" /usr/local/bin/sealos

      - name: 打包集群镜像并核对内容
        run: |
          bash .github/scripts/build-kubernetes-docker-upgrade.sh \
            "$KUBERNETES_VERSION" "$IMAGE" "$RUNNER_TEMP/sealos-images"

      - name: 保存可导入 Sealos 的 OCI 归档
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kubernetes-docker-${{ matrix.version }}-linux-amd64
          path: ${{ runner.temp }}/sealos-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
